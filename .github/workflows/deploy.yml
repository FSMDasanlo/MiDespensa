name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate config.js from secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os
          cfg = {
              "groqApiKey": os.environ.get("GROQ_API_KEY", ""),
              "geminiApiKey": os.environ.get("GEMINI_API_KEY", ""),
          }
          if not any(cfg.values()):
              raise SystemExit("ERROR: falta GROQ_API_KEY o GEMINI_API_KEY")
          with open("js/config.js", "w", encoding="utf-8") as f:
              f.write("window.APP_CONFIG = " + json.dumps(cfg) + ";\n")
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
